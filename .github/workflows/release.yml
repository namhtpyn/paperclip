name: Release

# Fork release lane, all in one run:
#   push to master -> semantic-release decides (conventional commits).
#     release cut -> build + publish image tagged with the new version.
#     no release   -> job exits green, nothing published.
#   push of a manual v* tag -> semantic-release skipped; image built at the
#     tag with the tag's version, GitHub release created.
# Building in the same run that cut the release is what makes the chain
# reliable: tags pushed by GITHUB_TOKEN do NOT re-trigger `on: push: tags`
# workflows (GitHub recursion guard), so a tag-triggered docker lane would
# silently never fire. Here nothing depends on the tag-push event.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- version resolution -------------------------------------------------
      # Manual tag push: version comes from the tag, no semantic-release.
      # Master push: semantic-release runs; a release happened iff the newest
      # release tag points at this commit (semantic-release tags the release
      # commit HEAD; it creates lightweight tags, so object.sha == commit).
      - name: Resolve release mode
        id: mode
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              echo "mode=tag" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "mode=master" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup Node.js
        if: steps.mode.outputs.mode == 'master'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Plugins are the three bundled with semantic-release itself, so a bare
      # npx invocation resolves them without installing project devDeps.
      - name: Run semantic-release
        if: steps.mode.outputs.mode == 'master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: namhtpyn-bot
          GIT_AUTHOR_EMAIL: namhtpyn@users.noreply.github.com
          GIT_COMMITTER_NAME: namhtpyn-bot
          GIT_COMMITTER_EMAIL: namhtpyn@users.noreply.github.com
        run: |
          set -euo pipefail
          npx -y semantic-release@24

      - name: Detect semantic-release outcome
        id: semrel
        if: steps.mode.outputs.mode == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq '.tag_name' 2>/dev/null || true)"
          version=""
          if [ -n "$tag" ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              --jq '.object.sha' 2>/dev/null || true)"
            if [ "$tag_sha" = "$GITHUB_SHA" ]; then
              version="${tag#v}"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "semantic-release: ${version:+cut version ${version}}(no release for this push)"

      - name: Finalize version
        id: final
        if: always() && steps.mode.conclusion == 'success'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          SEMREL_VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "tag" ]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$SEMREL_VERSION"
          fi
          majorminor="$(printf '%s' "$version" | cut -d. -f1,2)"
          {
            echo "version=${version}"
            echo "majorminor=${majorminor}"
          } >> "$GITHUB_OUTPUT"
          echo "final version: ${version:-none}"

      - name: Report skip
        if: steps.final.outputs.version == ''
        run: echo "No release is due and no tag was pushed. Nothing to publish."

      # ---- docker publish -----------------------------------------------------
      - name: Setup pnpm
        if: steps.final.outputs.version != ''
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js for build
        if: steps.final.outputs.version != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Same rationale as upstream docker.yml: the Dockerfile expects a
      # lockfile that matches the workspace package metadata.
      - name: Refresh lockfile for Docker build context
        if: steps.final.outputs.version != ''
        run: |
          set -euo pipefail
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile already matches package metadata."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi
          echo "Using refreshed pnpm-lock.yaml in the Docker build context."

      - name: Free runner disk
        if: steps.final.outputs.version != ''
        run: |
          set -euo pipefail
          sudo apt-get clean || true
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby || true
          docker system prune -af || true

      - name: Login to GitHub Container Registry
        if: steps.final.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.final.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      # ISO week stamp so the Dockerfile's tool layer caches within a week.
      - name: Compute tool cache epoch
        if: steps.final.outputs.version != ''
        id: tools-epoch
        run: echo "epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: steps.final.outputs.version != ''
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ steps.final.outputs.version }}
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            CLI_TOOLS_CACHE_EPOCH=${{ steps.tools-epoch.outputs.epoch }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.final.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.final.outputs.majorminor }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      # Manual tag path only: semantic-release already created the release on
      # the master path. `|| true` keeps a pre-existing release from failing.
      - name: Create GitHub release (manual tag path)
        if: steps.mode.outputs.mode == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            --verify-tag || echo "Release already exists."

      - name: Summarize
        if: steps.final.outputs.version != ''
        env:
          VERSION: ${{ steps.final.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Released ${VERSION}"
            echo ""
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`"
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
